<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="farmSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="cropWheat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="cropCarrot" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="waterStream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="lanternBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Greenhouse Glass Enclosure -->
  <rect width="800" height="500" fill="#0f172a"/>
  
  <!-- Glass Truss Ceiling -->
  <polygon points="50,110 400,20 750,110 750,130 400,45 50,130" fill="#334155"/>
  <g stroke="#38bdf8" stroke-width="2" opacity="0.4">
    <line x1="150" y1="85" x2="150" y2="160"/>
    <line x1="280" y1="50" x2="280" y2="160"/>
    <line x1="400" y1="20" x2="400" y2="160"/>
    <line x1="520" y1="50" x2="520" y2="160"/>
    <line x1="650" y1="85" x2="650" y2="160"/>
  </g>

  <!-- Farmland Terraced Steps (3 Tiers) -->
  <!-- Tier 1: Top (Potatoes/Carrots) -->
  <rect x="120" y="160" width="560" height="70" fill="#382314"/> <!-- Farmland Dirt -->
  <!-- Water Canal -->
  <rect x="385" y="160" width="30" height="70" fill="url(#waterStream)"/>
  <!-- Crops on Tier 1 -->
  <g fill="url(#cropCarrot)">
    <rect x="140" y="145" width="220" height="15"/>
    <rect x="440" y="145" width="220" height="15"/>
  </g>

  <!-- Tier 2: Middle (Wheat) -->
  <rect x="90" y="245" width="620" height="85" fill="#2d1c10"/>
  <!-- Water Canal -->
  <rect x="385" y="245" width="30" height="85" fill="url(#waterStream)"/>
  <!-- Golden Wheat Crops -->
  <g fill="url(#cropWheat)">
    <rect x="110" y="220" width="250" height="25"/>
    <rect x="440" y="220" width="250" height="25"/>
  </g>

  <!-- Tier 3: Bottom (Sugar Cane & Bamboo with Observer Array) -->
  <rect x="60" y="350" width="680" height="90" fill="#24170d"/>
  <!-- Water Canals along sides -->
  <rect x="80" y="360" width="640" height="15" fill="url(#waterStream)"/>
  <!-- Sugar Cane Stalks -->
  <g fill="#22c55e">
    <rect x="100" y="300" width="12" height="60"/>
    <rect x="130" y="295" width="12" height="65"/>
    <rect x="160" y="305" width="12" height="55"/>
    <rect x="190" y="290" width="12" height="70"/>

    <rect x="580" y="290" width="12" height="70"/>
    <rect x="610" y="300" width="12" height="60"/>
    <rect x="640" y="295" width="12" height="65"/>
    <rect x="670" y="305" width="12" height="55"/>
  </g>

  <!-- Center Collection Flume (Hoppers & Double Chests) -->
  <rect x="360" y="440" width="80" height="55" fill="#475569"/> <!-- Hoppers -->
  <rect x="340" y="460" width="120" height="35" rx="3" fill="#b45309"/> <!-- Double Chest -->
  <rect x="395" y="465" width="10" height="12" fill="#000"/> <!-- Iron Latch -->

  <!-- Dispensers Array at top (Redstone Water Flush) -->
  <g fill="#475569">
    <rect x="130" y="145" width="30" height="20" rx="3"/>
    <circle cx="145" cy="155" r="4" fill="#000"/>

    <rect x="230" y="145" width="30" height="20" rx="3"/>
    <circle cx="245" cy="155" r="4" fill="#000"/>

    <rect x="530" y="145" width="30" height="20" rx="3"/>
    <circle cx="545" cy="155" r="4" fill="#000"/>

    <rect x="630" y="145" width="30" height="20" rx="3"/>
    <circle cx="645" cy="155" r="4" fill="#000"/>
  </g>

  <!-- Redstone Wire Lines on Stone Ledges -->
  <line x1="110" y1="140" x2="690" y2="140" stroke="#ef4444" stroke-width="4"/>
  <circle cx="400" cy="140" r="8" fill="#ef4444" filter="url(#lanternBloom)"/>

  <!-- Hanging Glowstone / Lantern Fixtures -->
  <g transform="translate(180, 80)">
    <line x1="0" y1="0" x2="0" y2="35" stroke="#94a3b8" stroke-width="3"/>
    <rect x="-10" y="35" width="20" height="20" fill="#facc15" filter="url(#lanternBloom)"/>
  </g>

  <g transform="translate(620, 80)">
    <line x1="0" y1="0" x2="0" y2="35" stroke="#94a3b8" stroke-width="3"/>
    <rect x="-10" y="35" width="20" height="20" fill="#facc15" filter="url(#lanternBloom)"/>
  </g>
</svg>
