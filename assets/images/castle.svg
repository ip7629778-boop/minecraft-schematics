<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- Mountain backdrop -->
  <polygon points="0,500 120,320 280,420 450,260 620,400 800,280 800,500" fill="#090d16" opacity="0.7"/>
  <!-- Castle Base -->
  <rect x="220" y="240" width="360" height="260" fill="url(#stone)"/>
  <!-- Central Keep -->
  <rect x="330" y="140" width="140" height="200" fill="#334155"/>
  <!-- Towers -->
  <rect x="180" y="180" width="90" height="280" fill="#3b485d"/>
  <rect x="530" y="180" width="90" height="280" fill="#2d3748"/>
  <!-- Crenellations / Battlements -->
  <rect x="170" y="160" width="110" height="30" fill="#475569"/>
  <rect x="175" y="145" width="20" height="20" fill="#475569"/>
  <rect x="215" y="145" width="20" height="20" fill="#475569"/>
  <rect x="255" y="145" width="20" height="20" fill="#475569"/>

  <rect x="520" y="160" width="110" height="30" fill="#475569"/>
  <rect x="525" y="145" width="20" height="20" fill="#475569"/>
  <rect x="565" y="145" width="20" height="20" fill="#475569"/>
  <rect x="605" y="145" width="20" height="20" fill="#475569"/>

  <!-- Center Roof -->
  <polygon points="310,140 400,60 490,140" fill="#1e1b4b"/>
  <!-- Spire flag -->
  <line x1="400" y1="60" x2="400" y2="25" stroke="#f59e0b" stroke-width="4"/>
  <polygon points="400,25 450,38 400,50" fill="url(#gold)"/>

  <!-- Gatehouse arch -->
  <rect x="360" y="380" width="80" height="120" rx="40" fill="#0f172a"/>
  <!-- Portcullis Iron Bars -->
  <line x1="380" y1="380" x2="380" y2="500" stroke="#94a3b8" stroke-width="4"/>
  <line x1="400" y1="380" x2="400" y2="500" stroke="#94a3b8" stroke-width="4"/>
  <line x1="420" y1="380" x2="420" y2="500" stroke="#94a3b8" stroke-width="4"/>
  <line x1="360" y1="420" x2="440" y2="420" stroke="#94a3b8" stroke-width="3"/>
  <line x1="360" y1="460" x2="440" y2="460" stroke="#94a3b8" stroke-width="3"/>

  <!-- Glowing Torch / Windows -->
  <rect x="215" y="240" width="20" height="40" rx="10" fill="#fef08a" opacity="0.9"/>
  <rect x="565" y="240" width="20" height="40" rx="10" fill="#fef08a" opacity="0.9"/>
  <rect x="385" y="180" width="30" height="50" rx="15" fill="#fef08a" opacity="0.9"/>

  <!-- Badge / cinematic tag -->
  <rect x="40" y="40" width="160" height="34" rx="17" fill="rgba(0,0,0,0.6)" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="60" cy="57" r="6" fill="#10b981"/>
  <text x="76" y="62" fill="#fff" font-family="sans-serif" font-weight="700" font-size="13" letter-spacing="1">CINEMATIC 4K</text>
</svg>