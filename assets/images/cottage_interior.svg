<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#2d1c0b"/>
  <!-- Wood Plank Floor -->
  <polygon points="0,500 180,320 620,320 800,500" fill="#543310"/>
  <!-- Fireplace -->
  <rect x="330" y="200" width="140" height="150" fill="#475569" stroke="#334155" stroke-width="3"/>
  <rect x="360" y="260" width="80" height="90" rx="10" fill="#090d16"/>
  <polygon points="380,340 400,280 420,340" fill="#ea580c"/>
  <polygon points="390,340 400,300 410,340" fill="#facc15"/>
  <!-- Bookshelf Library -->
  <rect x="140" y="160" width="100" height="200" fill="#78350f" stroke="#b45309" stroke-width="2"/>
  <line x1="140" y1="210" x2="240" y2="210" stroke="#b45309" stroke-width="3"/>
  <line x1="140" y1="260" x2="240" y2="260" stroke="#b45309" stroke-width="3"/>
  <line x1="140" y1="310" x2="240" y2="310" stroke="#b45309" stroke-width="3"/>
  <text x="400" y="470" fill="#fde68a" font-family="sans-serif" font-weight="700" font-size="17" text-anchor="middle">Fireplace Living Room &amp; Library</text>
</svg>