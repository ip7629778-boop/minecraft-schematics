<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#1a1c23"/>
  <!-- Great Hall Floor -->
  <polygon points="0,500 200,340 600,340 800,500" fill="#2d3748"/>
  <!-- Grand Columns -->
  <rect x="180" y="60" width="45" height="360" fill="#4a5568"/>
  <rect x="575" y="60" width="45" height="360" fill="#4a5568"/>
  <!-- Throne / Stained Glass -->
  <rect x="350" y="140" width="100" height="180" rx="50" fill="#e11d48" opacity="0.85"/>
  <text x="400" y="460" fill="#94a3b8" font-family="sans-serif" font-weight="bold" font-size="18" text-anchor="middle">Interior: Throne &amp; Banquet Hall</text>
</svg>