<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a10"/>
      <stop offset="50%" stop-color="#0d131f"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="2">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <!-- Glowing badge pill -->
  <rect x="80" y="90" width="360" height="42" rx="21" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="2"/>
  <circle cx="106" cy="111" r="7" fill="#10b981"/>
  <text x="126" y="117" fill="#34d399" font-family="sans-serif" font-weight="700" font-size="16" letter-spacing="1.5">MINECRAFT 1.20 - 1.21.4</text>

  <!-- Headline -->
  <text x="80" y="220" fill="#ffffff" font-family="'Courier New', monospace" font-weight="900" font-size="58" letter-spacing="-1">MINEVAULT SCHEMATICS</text>
  <text x="80" y="295" fill="url(#brandGrad)" font-family="sans-serif" font-weight="800" font-size="48">DOWNLOAD VERIFIED BUILDS</text>

  <!-- Subtitle -->
  <text x="80" y="365" fill="#94a3b8" font-family="sans-serif" font-size="24" font-weight="500">
    Multi-screenshot galleries, WorldEdit (.schem), Litematica (.litematic) &amp; full world saves.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(80, 430)">
    <rect x="0" y="0" width="220" height="52" rx="12" fill="#141c2e" stroke="rgba(255,255,255,0.1)"/>
    <text x="110" y="32" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="18" text-anchor="middle">.SCHEM FORMAT</text>

    <rect x="240" y="0" width="240" height="52" rx="12" fill="#141c2e" stroke="rgba(255,255,255,0.1)"/>
    <text x="360" y="32" fill="#10b981" font-family="sans-serif" font-weight="700" font-size="18" text-anchor="middle">.LITEMATIC FORMAT</text>

    <rect x="500" y="0" width="220" height="52" rx="12" fill="#141c2e" stroke="rgba(255,255,255,0.1)"/>
    <text x="610" y="32" fill="#f59e0b" font-family="sans-serif" font-weight="700" font-size="18" text-anchor="middle">WORLD SAVE (.ZIP)</text>
  </g>

  <!-- Right Side Decorative Block Artwork -->
  <g transform="translate(940, 260)">
    <!-- 3D Cube Icon -->
    <polygon points="0,-120 100,-60 0,0 -100,-60" fill="#10b981"/>
    <polygon points="-100,-60 0,0 0,120 -100,60" fill="#047857"/>
    <polygon points="0,0 100,-60 100,60 0,120" fill="#065f46"/>
    <!-- Glow ring -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="14 10" opacity="0.3"/>
  </g>

  <!-- Footer domain branding -->
  <text x="80" y="565" fill="#64748b" font-family="sans-serif" font-weight="700" font-size="18" letter-spacing="2">FREE &amp; OPEN-SOURCE ON GITHUB PAGES</text>
</svg>

