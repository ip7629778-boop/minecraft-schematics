<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#1e293b"/>
  <!-- Battlements wall close up -->
  <rect x="100" y="100" width="600" height="400" fill="#334155" stroke="#475569" stroke-width="4"/>
  <!-- Large Gate Arch -->
  <rect x="260" y="180" width="280" height="320" rx="80" fill="#0f172a"/>
  <!-- Portcullis Iron Grate -->
  <line x1="310" y1="180" x2="310" y2="500" stroke="#94a3b8" stroke-width="6"/>
  <line x1="360" y1="180" x2="360" y2="500" stroke="#94a3b8" stroke-width="6"/>
  <line x1="410" y1="180" x2="410" y2="500" stroke="#94a3b8" stroke-width="6"/>
  <line x1="460" y1="180" x2="460" y2="500" stroke="#94a3b8" stroke-width="6"/>
  <line x1="260" y1="260" x2="540" y2="260" stroke="#94a3b8" stroke-width="5"/>
  <line x1="260" y1="360" x2="540" y2="360" stroke="#94a3b8" stroke-width="5"/>
  <line x1="260" y1="440" x2="540" y2="440" stroke="#94a3b8" stroke-width="5"/>
  <!-- Crenellations top -->
  <rect x="120" y="70" width="50" height="40" fill="#475569"/>
  <rect x="220" y="70" width="50" height="40" fill="#475569"/>
  <rect x="320" y="70" width="50" height="40" fill="#475569"/>
  <rect x="420" y="70" width="50" height="40" fill="#475569"/>
  <rect x="520" y="70" width="50" height="40" fill="#475569"/>
  <rect x="620" y="70" width="50" height="40" fill="#475569"/>
  <!-- Murder holes -->
  <rect x="200" y="240" width="25" height="50" rx="6" fill="#0f172a"/>
  <rect x="575" y="240" width="25" height="50" rx="6" fill="#0f172a"/>
  <text x="400" y="470" fill="#e2e8f0" font-family="sans-serif" font-weight="700" font-size="18" text-anchor="middle">Gatehouse &amp; Portcullis Detail</text>
</svg>