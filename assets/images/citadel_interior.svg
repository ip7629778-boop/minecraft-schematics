<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hallWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <filter id="fireGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hall Background -->
  <rect width="800" height="500" fill="url(#hallWall)"/>

  <!-- Checkerboard Stone Floor -->
  <g fill="#1e293b" opacity="0.6">
    <polygon points="0,420 800,420 800,500 0,500"/>
  </g>
  <g stroke="#334155" stroke-width="1.5" opacity="0.4">
    <line x1="100" y1="420" x2="0" y2="500"/>
    <line x1="250" y1="420" x2="160" y2="500"/>
    <line x1="400" y1="420" x2="400" y2="500"/>
    <line x1="550" y1="420" x2="640" y2="500"/>
    <line x1="700" y1="420" x2="800" y2="500"/>
    <line x1="0" y1="455" x2="800" y2="455"/>
  </g>

  <!-- Vaulted Dark Oak Wooden Roof Trusses -->
  <polygon points="0,0 400,120 800,0 800,35 400,150 0,35" fill="#451a03"/>
  <line x1="400" y1="120" x2="400" y2="420" stroke="#291102" stroke-width="8"/>
  <line x1="200" y1="60" x2="200" y2="420" stroke="#291102" stroke-width="6"/>
  <line x1="600" y1="60" x2="600" y2="420" stroke="#291102" stroke-width="6"/>

  <!-- Massive Grand Stone Fireplace (Center Back) -->
  <rect x="300" y="240" width="200" height="180" fill="#334155"/>
  <rect x="290" y="225" width="220" height="20" fill="#475569"/>
  <!-- Fireplace Hearth Arch -->
  <rect x="340" y="290" width="120" height="130" rx="35" fill="#0b0f19"/>

  <!-- Fireplace Roaring Fire with Warm Light Bloom -->
  <ellipse cx="400" cy="390" rx="90" ry="60" fill="#f97316" filter="url(#fireGlow)" opacity="0.4"/>
  <path d="M360,420 Q375,340 395,350 Q400,320 415,355 Q430,345 440,420 Z" fill="url(#fireGrad)" filter="url(#fireGlow)"/>

  <!-- Mantle Decorations -->
  <rect x="320" y="205" width="12" height="20" fill="#fbbf24"/>
  <rect x="468" y="205" width="12" height="20" fill="#fbbf24"/>
  <circle cx="400" cy="205" r="16" fill="#10b981" stroke="#fbbf24" stroke-width="3"/>

  <!-- Royal Velvet Carpet Runner -->
  <polygon points="350,420 450,420 480,500 320,500" fill="#991b1b"/>
  <polygon points="354,420 360,420 330,500 324,500" fill="#fbbf24"/>
  <polygon points="440,420 446,420 476,500 470,500" fill="#fbbf24"/>

  <!-- Left: Library Bookshelves & Enchanting Setup -->
  <g transform="translate(60, 240)">
    <rect x="0" y="0" width="90" height="180" fill="#78350f"/>
    <!-- Bookshelf shelves -->
    <rect x="6" y="25" width="78" height="22" fill="#b91c1c"/>
    <rect x="6" y="65" width="78" height="22" fill="#1d4ed8"/>
    <rect x="6" y="105" width="78" height="22" fill="#047857"/>
    <rect x="6" y="145" width="78" height="22" fill="#b45309"/>
    <!-- Enchanting Table in Front -->
    <rect x="15" y="140" width="60" height="35" rx="4" fill="#991b1b"/>
    <rect x="25" y="130" width="40" height="12" fill="#b91c1c"/>
    <polygon points="45,120 35,130 55,130" fill="#0284c7"/>
  </g>

  <!-- Right: Royal Armor Stands with Diamond Gear -->
  <g transform="translate(650, 260)">
    <!-- Armor Stand Wood Pedestal -->
    <rect x="25" y="130" width="40" height="10" fill="#78350f"/>
    <line x1="45" y1="30" x2="45" y2="130" stroke="#78350f" stroke-width="6"/>
    <!-- Diamond Armor Pieces -->
    <rect x="35" y="20" width="20" height="20" rx="3" fill="#38bdf8"/> <!-- Helmet -->
    <rect x="30" y="45" width="30" height="40" rx="3" fill="#0284c7"/> <!-- Chestplate -->
    <rect x="33" y="90" width="24" height="25" fill="#0284c7"/> <!-- Leggings -->
    <rect x="28" y="118" width="14" height="12" fill="#38bdf8"/> <!-- Boots -->
    <rect x="48" y="118" width="14" height="12" fill="#38bdf8"/>
    <!-- Diamond Sword -->
    <line x1="65" y1="40" x2="80" y2="110" stroke="#38bdf8" stroke-width="4"/>
  </g>

  <!-- Iron Chandeliers Hanging from Ceiling -->
  <g transform="translate(240, 80)">
    <line x1="60" y1="0" x2="60" y2="70" stroke="#64748b" stroke-width="3"/>
    <line x1="10" y1="70" x2="110" y2="70" stroke="#475569" stroke-width="4"/>
    <circle cx="20" cy="65" r="6" fill="#f59e0b" filter="url(#fireGlow)"/>
    <circle cx="60" cy="65" r="6" fill="#f59e0b" filter="url(#fireGlow)"/>
    <circle cx="100" cy="65" r="6" fill="#f59e0b" filter="url(#fireGlow)"/>
  </g>

  <g transform="translate(440, 80)">
    <line x1="60" y1="0" x2="60" y2="70" stroke="#64748b" stroke-width="3"/>
    <line x1="10" y1="70" x2="110" y2="70" stroke="#475569" stroke-width="4"/>
    <circle cx="20" cy="65" r="6" fill="#f59e0b" filter="url(#fireGlow)"/>
    <circle cx="60" cy="65" r="6" fill="#f59e0b" filter="url(#fireGlow)"/>
    <circle cx="100" cy="65" r="6" fill="#f59e0b" filter="url(#fireGlow)"/>
  </g>

  <!-- High Gothic Stained Glass Windows on Sides -->
  <rect x="185" y="140" width="30" height="90" rx="15" fill="#38bdf8" opacity="0.35"/>
  <rect x="585" y="140" width="30" height="90" rx="15" fill="#38bdf8" opacity="0.35"/>
</svg>
