<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050515"/>
      <stop offset="60%" stop-color="#180c2e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#cyberSky)"/>
  <!-- Background silhouettes -->
  <rect x="60" y="240" width="110" height="260" fill="#0d1124"/>
  <rect x="620" y="200" width="120" height="300" fill="#0d1124"/>
  <!-- Main Skyscraper -->
  <rect x="300" y="80" width="200" height="420" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
  <!-- Hologram rings -->
  <ellipse cx="400" cy="180" rx="140" ry="24" fill="none" stroke="url(#neonPink)" stroke-width="4" stroke-dasharray="8 6"/>
  <ellipse cx="400" cy="280" rx="160" ry="26" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-dasharray="12 6"/>
  <!-- Neon Vertical Strips -->
  <line x1="330" y1="100" x2="330" y2="500" stroke="#06b6d4" stroke-width="5" opacity="0.8"/>
  <line x1="470" y1="100" x2="470" y2="500" stroke="#ec4899" stroke-width="5" opacity="0.8"/>
  <line x1="400" y1="80" x2="400" y2="20" stroke="#facc15" stroke-width="4"/>
  <!-- Drone light -->
  <circle cx="240" cy="140" r="4" fill="#22c55e"/>
  <line x1="240" y1="140" x2="280" y2="180" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="400" y="470" fill="#38bdf8" font-family="sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="4">NEO-TOKYO TOWER</text>
</svg>