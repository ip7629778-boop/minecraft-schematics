<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Chunk Not Found | MineVault</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <style>
    .error-container {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-family: var(--font-pixel);
      font-size: clamp(3rem, 10vw, 6rem);
      color: var(--accent-redstone);
      text-shadow: 0 0 30px rgba(239, 68, 68, 0.4);
      margin-bottom: 1rem;
    }
    .error-title {
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }
    .error-desc {
      color: var(--text-muted);
      max-width: 480px;
      margin-bottom: 2rem;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">CHUNK NOT GENERATED</h1>
    <p class="error-desc">
      You've fallen into the void! The page or schematic file you are looking for has been moved, unloaded, or despawned.
    </p>
    <a href="index.html" class="btn btn-primary">
      <i data-lucide="compass"></i> Teleport Back to Vault
    </a>
  </div>
  <script src="assets/js/lucide.min.js"></script>
  <script>
    if (window.lucide) window.lucide.createIcons();
  </script>
</body>
</html>
